<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Lyric Synchronization</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
          crossorigin="anonymous"
    >
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
            crossorigin="anonymous">
    </script>
    <script src="https://www.youtube.com/iframe_api"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <script src="lyrics.js"></script>
</head>
<body class="container-md">
    <div class="row alert">
        <div class="col-md-12">
            <h1>Lyric Synchronization</h1>
            <p class="lead">Audio-based lyrics timestamp tool</p>
        </div>
    </div>
<div class="row alert">
    <div class="col-md-12">
        <div id="play" style="overflow-x: auto"></div>
    </div>
</div>
<div class="row alert">
    <div class="col-md-12">
        <p>
            <label>
                Offset (s)
                <input type="number" step="0.1" class="form-control" value="0" id="offset">
            </label>
            &nbsp;&nbsp;
            If offset is <code>- 0.5s</code>, when clicking a lyric when the current time of
            audio is <code>t</code>, the timestamp will be <code>t - 0.5s</code>.
        </p>
        <div class="list-group" id="lyrics-lines"></div>
        <div class="mt-2 d-flex justify-content-center">
            <a role="button" class="btn btn-primary" id="download-lyrics" onclick="save_lyrics()">Save</a>
        </div>
    </div>
</div>
</body>
<script>
const lyric_template = document.createElement('div');
lyric_template.className = "list-group-item list-group-item-action d-flex justify-content-between align-items-center";
lyric_template.style.padding = "0";

const span_template = document.createElement('span');
span_template.setAttribute("onclick", "switch_lyric(this)");
span_template.style.cursor = "pointer";
span_template.style.flexGrow = "1";
span_template.style.padding = "0.5rem 1rem";
span_template.style.userSelect = "none";
lyric_template.appendChild(span_template);

const button_template = document.createElement('button');
button_template.className = "btn btn-sm me-2";
button_template.setAttribute("onclick", "edit_lyric(this, event)");
const icon_template = document.createElement('i');
icon_template.className = "bi bi-pencil";
button_template.appendChild(icon_template);
lyric_template.appendChild(button_template);

const input_template = document.createElement("textarea");
input_template.rows = "1";
input_template.className = "form-control";
input_template.style.flexGrow = "1";
input_template.style.margin = "0.25rem 0.5rem";

window.addEventListener('DOMContentLoaded', () => {
    const audioUrl = window.LYRIA_AUDIO_URL;
    const lyricsText = window.LYRIA_LYRICS_TEXT;

    if (audioUrl) {
        let audio_tag = document.createElement('audio');
        audio_tag.controls = true;
        audio_tag.src = audioUrl;
        audio_tag.style.width = "100%";
        let player = document.getElementById('play');
        player.innerHTML = '';
        player.appendChild(audio_tag);
    }

    if (lyricsText) {
        const editor = document.getElementById("lyrics-lines");
        editor.innerHTML = "";
        const parsed_lyrics = parse_lyrics(lyricsText);
        for (const item of parsed_lyrics) {
            const lyric_node = lyric_template.cloneNode(true);
            const span = lyric_node.querySelector('span');
            span.setAttribute("lrc", item.is_lrc);
            span.textContent = item.text;
            editor.appendChild(lyric_node);
        }
    }
});

function edit_lyric(btn, event) {
    event.stopPropagation();
    const span = btn.previousElementSibling;
    if (span.style.display === "none") return;

    const original_text = span.textContent;
    const input = input_template.cloneNode(true);
    input.value = original_text;

    span.style.display = "none";
    span.parentNode.insertBefore(input, span);
    input.focus();

    function save_edit() {
        if (input.parentNode) {
            span.textContent = input.value;
            span.style.display = "";
            input.remove();
        }
    }

    input.addEventListener("blur", save_edit);
    input.addEventListener("keyup", function(e) {
        if (e.key === "Enter") {
            save_edit();
        } else if (e.key === "Escape") {
            input.value = original_text;
            save_edit();
        }
    });
}
function switch_lyric(button) {
    const is_lrc = button.getAttribute("lrc");
    let lyric = button.textContent;
    if (is_lrc === "true") {
        button.setAttribute("lrc", false);
        button.innerText = remove_lyric_time(lyric);
    } else {
        let current_time_f;
        let total_time_f;
        const player = document.getElementById("play").firstChild;
        if (player) {
            current_time_f = player.currentTime;
            total_time_f = player.duration;
        } else {
            current_time_f = 0;
            total_time_f = 0;
        }
        let offset = parseFloat(document.getElementById("offset").value);
        if (isNaN(offset)) {
            offset = 0;
        }
        button.setAttribute("lrc", true);
        button.innerText = `${format_lyric_time(current_time_f, total_time_f, offset)} ${lyric}`;
    }
}
function save_lyrics() {
    const lyrics_list = document.getElementById("lyrics-lines");
    let lyrics = [];
    for (let button of lyrics_list.children) {
        lyrics.push(button.textContent);
    }
    const lyrics_text = lyrics.join("\n");
    
    if (window.LYRIA_SAVE_URL) {
        const payload = {
            track_id: window.LYRIA_TRACK_ID,
            language: window.LYRIA_LANGUAGE,
            lyrics_text: lyrics_text
        };
        const saveBtn = document.getElementById("download-lyrics");
        saveBtn.innerText = "Saving...";
        fetch(window.LYRIA_SAVE_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        }).then(res => res.json())
          .then(data => {
              if (data.status === 'ok') {
                  saveBtn.innerText = "Saved!";
                  setTimeout(() => saveBtn.innerText = "Save", 2000);
              } else {
                  alert("Failed to save.");
                  saveBtn.innerText = "Save";
              }
          }).catch(err => {
              console.error(err);
              alert("Error saving lyrics.");
              saveBtn.innerText = "Save";
          });
    } else {
        const lyrics_blob = new Blob([lyrics_text], { type: "text/plain" });
        const lyrics_url = URL.createObjectURL(lyrics_blob);
        let filename = "lyrics.lrc";
        const download_link = document.createElement('a');
        download_link.href = lyrics_url;
        download_link.download = extension_name_lrc(filename);
        download_link.click();
        URL.revokeObjectURL(lyrics_url);
    }
}
</script>
</html>
